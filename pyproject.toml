[project]
name = "hwva"
version = "0.1.0"
description = "Idea -> vertical video with a verbatim spoken line. HOLYWATER AI Engineer test task."
readme = "README.md"
authors = [
    { name = "Olexandr Uvarov" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.31.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pydantic>=2.14.1",
    "python-dotenv>=1.1",
    "pyyaml>=6.0.3",
    # Lip-sync gate (specs/sync.md): SyncNet decides. ~900 MB with CPU PyTorch; weights are not
    # on PyPI: see README "SyncNet" (HWVA_SYNCNET_WEIGHTS). torch listed to pin the CPU index.
    "syncnet-python>=0.2.3",
    "torch",
    "torchvision",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
video = "hwva.cli:main"
eval = "hwva.eval:main"
check = "hwva.devtools:check"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Ukrainian text: Cyrillic letters and apostrophes are intended

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hwva"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: needs ffmpeg/ffprobe on PATH",
    "live: calls paid/real APIs, run explicitly with -m live",
    "syncnet: real local SyncNet inference on a clip already on disk (skips when absent; no network)",
]
addopts = "-m 'not live'"
